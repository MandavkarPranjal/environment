# uosc replaces mpv's built-in OSC
osc=no

# uosc draws its own progress/volume indicators and window controls
osd-bar=no
border=no

# Video / GPU. Intel UHD 630 has working VA-API (iHD_drv_video.so), so hwdec
# is safe here. Set hwdec=no if anything ever renders wrong.
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe
profile=gpu-hq

# Let the compositor know the window's colour space (HDR/SDR correctness)
target-colorspace-hint=yes

# Subtitles: YouTube-like position and size
sub-margin-y=68
sub-font-size=32
sub-border-size=1.5
